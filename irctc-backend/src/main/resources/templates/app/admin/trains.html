<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage trains · Railway Portal</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container page-shell py-4 py-lg-5">
  <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><p class="eyebrow mb-2">Administration</p><h1 class="h2 page-heading mb-0">Manage trains</h1></div><a class="btn btn-primary" th:href="@{/app/admin/trains/new}">Add train</a></div>
  <div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
  <div class="empty-state p-4" th:if="${#lists.isEmpty(trains)}"><h2 class="h6">No trains have been added</h2><p class="text-secondary">Add a train to make it available in passenger search.</p><a class="btn btn-primary" th:href="@{/app/admin/trains/new}">Add first train</a></div>
  <div class="surface-panel p-2 p-md-3" th:if="${!#lists.isEmpty(trains)}"><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>Number</th><th>Train</th><th>From</th><th>To</th><th>Class capacity</th><th>Class fares</th><th class="text-end">Action</th></tr></thead><tbody><tr th:each="train : ${trains}"><td class="fw-semibold" th:text="${train.trainNumber}">Number</td><td th:text="${train.trainName}">Name</td><td th:text="${train.source}">Source</td><td th:text="${train.destination}">Destination</td><td th:text="${'Sleeper ' + train.sleeperSeats + ' · AC ' + train.acSeats}">Capacity</td><td th:text="${'Sleeper ₹' + #numbers.formatDecimal(train.sleeperFare, 1, 'COMMA', 2, 'POINT') + ' · AC ₹' + #numbers.formatDecimal(train.acFare, 1, 'COMMA', 2, 'POINT')}">Fares</td><td class="text-end"><a class="btn btn-outline-primary btn-sm" th:href="@{/app/admin/trains/{id}/edit(id=${train.id})}">Edit</a></td></tr></tbody></table></div></div>
</main>
</body>
</html>
