<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile · Railway Portal</title>
  <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}"><link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/navigation :: navigation}"></div>
<main class="container page-shell py-4 py-lg-5">
  <p class="eyebrow mb-2">Account</p><h1 class="h2 page-heading mb-4">My profile</h1>
  <div class="alert alert-success" role="status" th:if="${successMessage}" th:text="${successMessage}"></div>
  <section class="surface-panel p-4 p-md-5 col-lg-8">
    <div class="row g-4 mb-4">
      <div class="col-sm-6"><span class="small text-secondary d-block">Username</span><strong th:text="${profileUser.username}">Username</strong><div class="form-text">Username changes are not supported.</div></div>
      <div class="col-sm-6"><span class="small text-secondary d-block">Account role</span><strong th:text="${profileUser.role == 'ROLE_ADMIN' ? 'Administrator' : 'Passenger'}">Role</strong></div>
    </div>
    <form th:action="@{/app/profile}" th:object="${profileRequest}" method="post" novalidate>
      <label class="form-label" for="email">Email address</label>
      <input class="form-control" id="email" type="email" th:field="*{email}" required maxlength="254" autocomplete="email" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
      <div class="invalid-feedback" th:errors="*{email}">Enter a valid email address.</div>
      <div class="d-flex justify-content-end mt-4"><button class="btn btn-primary" type="submit">Save changes</button></div>
    </form>
  </section>
</main>
</body>
</html>
